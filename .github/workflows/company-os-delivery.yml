name: SINA Company OS - governed Earnloop code delivery
on:
  push:
    branches: [main]
    paths: [".github/workflows/company-os-delivery.yml", "scripts/company-os-closeout.py", "scripts/company-os-release.py"]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}
  issues:
    types: [opened]
permissions:
  contents: read
concurrency:
  group: sina-company-os-delivery-earnloop
  cancel-in-progress: false

jobs:
  candidate:
    if: >-
      ${{ github.event_name != 'issues' || (github.event.issue.title == 'SINA: Run Company OS Delivery' && github.event.issue.user.login == 'kazemnezhadsina144-dot') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      state: ${{ steps.deliver.outputs.state }}
      head_sha: ${{ steps.deliver.outputs.head_sha }}
      workstream: ${{ steps.deliver.outputs.workstream }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install existing application dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Claim canonical Founder OS work and build one bounded candidate
        id: deliver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/company-os-delivery.py
      - name: Preserve original source and generated candidate hashes
        if: ${{ (steps.deliver.outputs.state == 'OPENED' || steps.deliver.outputs.state == 'BRANCH_READY') }}
        uses: actions/upload-artifact@v4
        with:
          name: sina-earnloop-workpacket-${{ github.run_id }}
          path: company-delivery-evidence.json
          if-no-files-found: error
          retention-days: 30

  readback:
    if: ${{ (needs.candidate.outputs.state == 'OPENED' || needs.candidate.outputs.state == 'BRANCH_READY') }}
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.head_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: sina-earnloop-workpacket-${{ github.run_id }}
          path: /tmp/sina-company-evidence
      - name: Independent runner source readback and complete application tests
        env:
          SINA_EVIDENCE_FILE: /tmp/sina-company-evidence/company-delivery-evidence.json
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          python3 scripts/company-os-readback.py

  closeout:
    needs: [candidate, readback]
    outputs:
      state: ${{ steps.verified.outputs.state }}
    if: ${{ always() && needs.candidate.result == 'success' && (needs.readback.result == 'success' || needs.readback.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: ${{ needs.candidate.outputs.head_sha != '' }}
        uses: actions/download-artifact@v4
        with:
          name: sina-earnloop-workpacket-${{ github.run_id }}
          path: /tmp/sina-company-evidence
      - name: Verify GitHub provenance with isolated verifier and advance existing queue
        id: verified
        env:
          SINA_EVIDENCE_FILE: /tmp/sina-company-evidence/company-delivery-evidence.json
        run: python3 scripts/company-os-closeout.py
      - name: Start next canonical coding task without a new founder prompt
        if: ${{ steps.verified.outputs.state == 'TECHNICALLY_VERIFIED' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run company-os-delivery.yml --ref main
      - uses: actions/upload-artifact@v4
        with:
          name: sina-earnloop-verification-${{ github.run_id }}
          path: company-delivery-verification.json
          if-no-files-found: ignore
          retention-days: 90

  # Fallback for an org where GITHUB_TOKEN can push checked code but is
  # explicitly prohibited from creating PRs. Only new generated helper + test
  # paths, exact immutable source, independently signed verifier receipt and
  # GitHub normal branch protection are permitted. No force-push or bypass.
  release:
    needs: [candidate, readback, closeout]
    if: >-
      ${{ always() && needs.candidate.result == 'success' &&
          needs.readback.result == 'success' &&
          needs.closeout.result == 'success' &&
          needs.closeout.outputs.state == 'TECHNICALLY_VERIFIED' &&
          needs.candidate.outputs.head_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: sina-earnloop-workpacket-${{ github.run_id }}
          path: /tmp/sina-company-evidence
      - uses: actions/download-artifact@v4
        with:
          name: sina-earnloop-verification-${{ github.run_id }}
          path: /tmp/sina-company-verified
      - name: Install existing application dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Reverify the signed evidence and fast-forward a generated-only candidate
        env:
          SINA_EVIDENCE_FILE: /tmp/sina-company-evidence/company-delivery-evidence.json
          SINA_RECEIPT_FILE: /tmp/sina-company-verified/company-delivery-verification.json
        run: python3 scripts/company-os-release.py
      - name: Verify generated-only release authorization guards
        if: always()
        run: python3 -m unittest discover -s tests -p 'test_company_os_release.py' -v
