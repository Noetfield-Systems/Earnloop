name: Verify Earnloop
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run verify
      - name: Install browser for changed member journeys
        run: npx playwright install --with-deps chromium
      - name: Exercise isolated mobile member and sponsor journeys
        run: |
          node --import ./tests/fixtures/local-db.mjs src/server.mjs > /tmp/earnloop-test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3100/health && break || sleep 1; done
          node scripts/browser-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: member-journey-browser-evidence
          path: test-results/
          if-no-files-found: ignore
  smoke-production:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live Earnloop HTTP routes and fail-closed money gates
        run: node scripts/smoke-public.mjs
